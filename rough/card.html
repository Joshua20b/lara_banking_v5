<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
        }

        .card {
            border-radius: 15px;
            margin-bottom: 15px;
            padding: 20px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card-balance {
            background-color: #0d3b66;
        }

        .card-income {
            background-color: #000;
        }

        .card-expense {
            background-color: #2d6a4f;
        }

        .card h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        .card p {
            margin: 5px 0;
            font-size: 2rem;
            font-weight: bold;
        }

        .decorative-line {
            width: 100%;
            height: 20px;
            background-image: linear-gradient(45deg, #ffbc42 25%, transparent 25%, transparent 50%, #ffbc42 50%, #ffbc42 75%, transparent 75%, transparent);
            background-size: 28.28px 28.28px;
            border-top-right-radius: 15px;
            border-top-left-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="decorative-line"></div>
        <div class="card card-balance">
            <h2>Account Balance</h2>
            <p>$503,750.00</p>
        </div>
        <div class="decorative-line"></div>
        <div class="card card-income">
            <h2>Income</h2>
            <p>$500,000.00</p>
        </div>
        <div class="decorative-line"></div>
        <div class="card card-expense">
            <h2>Expense</h2>
            <p>$0.00</p>
        </div>
    </div>
</body>
</html>
